# 本機一鍵啟動：docker compose up --build
# 執行爬蟲：docker compose run --rm web python -m crawler.rakuten_crawler

services:
  db:
    image: mysql:8.0
    container_name: ichiban-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ichiban_price_monitor
      MYSQL_USER: ${COMPOSE_DB_USER:-ichiban}
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      # 資料庫第一次建立時，依檔名順序自動執行
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    ports:
      # 用 3307，避免和電腦上原本的 MySQL（3306）衝突
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    container_name: ichiban-web
    env_file:
      - path: .env
        required: false
    environment:
      # 容器內改連 db 服務，覆蓋 .env 裡給本機用的資料庫設定
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${COMPOSE_DB_USER:-ichiban}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-change_me}
      DB_NAME: ichiban_price_monitor
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mysql_data:
